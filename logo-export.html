<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I.N.E.S. logo export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:Montserrat,system-ui,sans-serif;background:#f4f4f4;color:#3D2E1C;margin:0;padding:32px;text-align:center}
  h1{font-family:'Playfair Display',serif;font-weight:700;margin:0 0 4px}
  h2{font-family:'Playfair Display',serif;font-weight:600;margin:40px 0 4px}
  .preview{display:inline-block;margin:14px auto;padding:20px;border-radius:14px;
    background:
      linear-gradient(45deg,#e6e6e6 25%,transparent 25%),
      linear-gradient(-45deg,#e6e6e6 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#e6e6e6 75%),
      linear-gradient(-45deg,transparent 75%,#e6e6e6 75%);
    background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;background-color:#fff}
  canvas{max-width:86vw;height:auto;display:block}
  #sq{max-width:340px}
  .btns{margin:6px 0 4px}
  button{font:600 14px Montserrat,sans-serif;background:#C8963E;color:#fff;border:0;
    padding:11px 18px;border-radius:999px;margin:5px;cursor:pointer}
  button.brown{background:#3D2E1C}
  button.ghost{background:#fff;color:#3D2E1C;border:2px solid #C8963E}
  p.hint{color:#7a6a55;font-size:13px;max-width:600px;margin:8px auto 0}
</style>
</head>
<body>
  <h1>I.N.E.S. — logo export</h1>
  <p class="hint">Шахматка = прозрачный фон (на картинке его не будет). Жми нужную кнопку — PNG скачается в высоком разрешении.</p>

  <h2>Квадрат 1:1 — для Google Business</h2>
  <div class="preview"><canvas id="sq"></canvas></div>
  <div class="btns">
    <button class="ghost" data-sq="">1:1 прозрачный фон</button>
    <button data-sq="#ffffff">1:1 белый фон</button>
    <button class="brown" data-sq="#C8963E">1:1 золотой фон</button>
  </div>

  <h2>Горизонтальный — для шапки / email</h2>
  <div class="preview"><canvas id="hz"></canvas></div>
  <div class="btns">
    <button class="ghost" data-hz="">прозрачный фон</button>
    <button data-hz="#ffffff">белый фон</button>
  </div>

<script>
const ICON_PATHS = [
  "M32 11c-1.1-2-3.8-1.1-3.8 0.9 0 1.7 2.4 3 3.8 4 1.4-1 3.8-2.3 3.8-4 0-2-2.7-2.9-3.8-0.9z",
  "M32 16.2c-0.6-1.6-0.3-3 0-4",
  "M32 16.2 A4 1.8 0 1 1 30.5 19.6 A7 2.2 0 1 1 30.5 24.6 A10 2.6 0 1 1 31 29.8",
  "M17.5 33 L46.5 33 L43.7 52.5 C43.5 53.8 42.4 54.8 41 54.8 L23 54.8 C21.6 54.8 20.5 53.8 20.3 52.5 Z"
];
const BROWN='#3D2E1C', GOLD='#C8963E', CREAMTXT='#C8963E';
const SCALE=4;

function fonts(){
  return Promise.all([
    document.fonts.load('700 80px "Playfair Display"'),
    document.fonts.load('600 24px "Montserrat"')
  ]).then(()=>document.fonts.ready);
}
function icon(ctx,x,y,size){
  ctx.save(); ctx.translate(x,y); ctx.scale(size/64,size/64);
  ctx.strokeStyle=BROWN; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ICON_PATHS.forEach(d=>ctx.stroke(new Path2D(d)));
  ctx.restore();
}

/* ---------- horizontal lockup ---------- */
const hz=document.getElementById('hz'), hc=hz.getContext('2d');
function drawHz(bg){
  const iconSize=104, iconX=12, iconY=34, textX=iconX+iconSize+28, inesSize=66, tagSize=18, tagSp=4;
  hc.setTransform(1,0,0,1,0,0);
  hc.font='700 '+inesSize+'px "Playfair Display",serif'; hc.letterSpacing='3px';
  const wI=hc.measureText('I.N.E.S.').width;
  hc.font='600 '+tagSize+'px "Montserrat",sans-serif'; hc.letterSpacing=tagSp+'px';
  const wT=Math.max(hc.measureText('IMPECCABLE NATURALS').width,hc.measureText('EXQUISITE SWEETS').width);
  const Wl=Math.ceil(textX+Math.max(wI,wT)+16), Hl=168;
  hz.width=Wl*SCALE; hz.height=Hl*SCALE; hc.setTransform(SCALE,0,0,SCALE,0,0);
  hc.clearRect(0,0,Wl,Hl); if(bg){hc.fillStyle=bg;hc.fillRect(0,0,Wl,Hl);}
  icon(hc,iconX,iconY,iconSize);
  hc.fillStyle=BROWN; hc.font='700 '+inesSize+'px "Playfair Display",serif'; hc.letterSpacing='3px';
  hc.textAlign='left'; hc.textBaseline='alphabetic'; hc.fillText('I.N.E.S.',textX,84);
  hc.fillStyle=CREAMTXT; hc.font='600 '+tagSize+'px "Montserrat",sans-serif'; hc.letterSpacing=tagSp+'px';
  hc.fillText('IMPECCABLE NATURALS',textX+2,116); hc.fillText('EXQUISITE SWEETS',textX+2,140);
}

/* ---------- square 1:1 stacked ---------- */
const sq=document.getElementById('sq'), sc=sq.getContext('2d');
function drawSq(bg){
  const S=1000;
  sq.width=S*SCALE; sq.height=S*SCALE; sc.setTransform(SCALE,0,0,SCALE,0,0);
  sc.clearRect(0,0,S,S); if(bg){sc.fillStyle=bg;sc.fillRect(0,0,S,S);}
  // icon centered top
  const iSize=240; icon(sc,(S-iSize)/2,205,iSize);
  // I.N.E.S.
  sc.fillStyle=BROWN; sc.textAlign='center'; sc.textBaseline='alphabetic';
  sc.font='700 120px "Playfair Display",serif'; sc.letterSpacing='5px';
  sc.fillText('I.N.E.S.',S/2,600);
  // tagline two lines
  sc.fillStyle=CREAMTXT; sc.font='600 30px "Montserrat",sans-serif'; sc.letterSpacing='6px';
  sc.fillText('IMPECCABLE NATURALS',S/2,662);
  sc.fillText('EXQUISITE SWEETS',S/2,706);
}

function dl(canvas,draw,bg,name){ draw(bg); canvas.toBlob(function(b){
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
},'image/png'); }

fonts().then(function(){
  drawSq(null); drawHz(null);
  document.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>dl(sq,drawSq,b.dataset.sq||null,'ines-logo-square.png'));
  document.querySelectorAll('[data-hz]').forEach(b=>b.onclick=()=>dl(hz,drawHz,b.dataset.hz||null,'ines-logo.png'));
});
</script>
</body>
</html>
